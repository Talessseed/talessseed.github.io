# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Refresh the DBLP snapshot every Monday. The non-round minute helps avoid
  # GitHub Actions' busiest scheduling window.
  schedule:
    - cron: "23 04 * * 1"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Reassert the workflow's active state on every scheduled run. GitHub disables
  # schedules in inactive public repositories after 60 days; GitHub currently
  # resets that countdown when its enable endpoint is called. If it is ever
  # disabled, it must be re-enabled once from the Actions page.
  keep-scheduled-refresh-active:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the weekly refresh enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_id="$(
            gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --jq '.workflow_id'
          )"
          if [[ ! "${workflow_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine the current workflow ID."
            exit 1
          fi
          gh api \
            --method PUT \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/enable"

  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Refresh publications from DBLP
        env:
          # If a scheduled refresh cannot reach DBLP, stop before deployment so
          # the currently published (newer) snapshot stays online.
          DBLP_REFRESH_REQUIRED: ${{ github.event_name == 'schedule' }}
        run: node scripts/update-publications.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
